<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./dist/output.css">
    <title>Log in</title>



</head>
<body class="w-full h-dvh overflow-x-hidden font-Noto bg-background ">

    <header class="text-base text-center mx-auto hidden">Forgot Password</header>
    <main class="w-full h-full flex flex-col items-center">

        <div class="main-container w-full h-full bg-background flex flex-col gap-y-10  items-center">

            <div class="heading w-full  h-16 md:h-20 flex bg-school-blue-dark  gap-x-10">
 
                

                    <img src="./assets/school-emblem.png" class=" h-16 md:h-20" alt="school logo">

                    <div class="divider w-0.5 h-16 md:h-20 bg-white"></div>

                    <div class="app-logo_container w-full   h-16 md:h-20 font-Playfair flex flex-col justify-center  "><h2 class="text-base leading-none md:text-2xl text-white tracking-wider">DEN EN CHOFU </h2><span class="  text-sm md:text-base text-white tracking-wider">GAKUEN</span>

                    <!-- <span class="text-xs font-Noto text-text-light tracking-wider mt-1">ClassRoll</span> -->
                    
                    </div>



                    
        

            </div>

        <form action="" id="forgot-password" class="w-full max-w-[90%] md:max-w-150 h-full max-h-120 xl:max-h-140 gap-y-10 flex flex-col items-center p-10 border rounded-xl xl:rounded-none border-border ">

            <h1 class="text-2xl xl:text-5xl font-Playfair font-bold text-school-blue-deep">Reset password</h1>


            <h2 class="text-sm xl:text-lg font-Noto font-semibold text-text-secondary">Enter your school email address below and we'll send you a password reset link.</h2>

            <div class="email-input h-auto   w-full flex flex-col gap-y-2 ">





                            <label for="school-email" class="text-sm text-school-blue-dark font-bold">School email</label>

                            <div class="group relative">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"          stroke="currentColor" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-school-blue group-focus-within:text-school-blue-dark pointer-events-none"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
                                </svg>

                                <input type="email" id="school-email" class="w-full rounded-lg border border-gray-300 py-3 pl-10 pr-4 text-base font-Noto focus:border-school-blue  focus:ring-school-blue/20 outline-none placeholder:font-Noto placeholder:text-xs text-text-primary" placeholder="taro.suzuki@ggl.chofu.ed.jp">

                                
                            </div>

                            <span id="error-email" class=" hidden text-school-red text-xs font-Noto">*Invalid email</span>

                            
                            
            </div>

            <button type="submit" id="reset-btn" class="w-full h-12 bg-school-blue hover:bg-school-blue-dark cursor-pointer text-white font-Noto hover:text-school-green-white text-base  rounded-md">Send Reset Link</button>

            <button type="submit" id="back-btn" class="w-full h-12 cursor-pointer gap-x-2 text-school-blue-deep font-Noto hover:text-school-green-white rounded-md flex flex-row justify-start items-center"> <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 text-school-green">
  <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 15.75 3 12m0 0 3.75-3.75M3 12h18" />
</svg>
Back to log in</button>



        </form>

        

                

    </main>
    <footer></footer>
    
</body>
</html>
