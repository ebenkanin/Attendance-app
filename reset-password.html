<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./dist/output.css">
    <title>Reset Password</title>

</head>
<body class="w-full min-h-dvh overflow-x-hidden font-Noto bg-background" >
            

    <header class="text-base text-center mx-auto hidden">
        Forgot Password
    </header>
    <main class="w-full min-h-dvh flex flex-col items-center">

        <div class="main-container w-full min-h-dvh bg-background flex flex-col gap-y-10  items-center">

            <div class="heading w-full  h-16 md:h-20 flex bg-school-blue-dark  gap-x-10">
 
                

                    <img src="./assets/school-emblem.png" class=" h-16 md:h-20" alt="school logo">

                    <div class="divider w-0.5 h-16 md:h-20 bg-white"></div>

                    <div class="app-logo_container w-full   h-16 md:h-20 font-Playfair flex flex-col justify-center  "><h2 class="text-base leading-none md:text-2xl text-white tracking-wider">DEN EN CHOFU </h2><span class="  text-sm md:text-base text-white tracking-wider">GAKUEN</span>

                    <!-- <span class="text-xs font-Noto text-text-light tracking-wider mt-1">ClassRoll</span> -->
                    
                    </div>



                    
        

            </div>



            <div class="reset-icon-container w-12 h-12 xl:w-20 xl:h-20  rounded-full bg-blue-100 flex justify-center items-center">
                
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="80" height="80" class=" w-8 h-8 xl:w-16 xl:h-16" fill="none" aria-hidden="true"
><path d="M38 49V34a22 22 0 0 1 44 0v15" stroke="#173B68" stroke-width="8"
    stroke-linecap="round"/><rect x="25" y="44" width="70" height="57" rx="10" fill="#245A96"/>
<path d="M35 48h50" stroke="#5D8DBD" stroke-width="2" stroke-linecap="round"/>
<circle cx="60" cy="67" r="7" fill="#FFFFFF" /><path d="M57 72h6l2 12h-10z" fill="#FFFFFF" />
 <g stroke="#20C997" stroke-width="3.5" stroke-linecap="round"><path d="M94 21l7-7" /><path d="M103 34h9" /><path d="M90 10V3" /></g>
</svg>
            </div>


            <h1 class="text-2xl xl:text-5xl font-Playfair font-bold text-school-blue-deep">Reset your password</h1>


            <h2 class="text-sm xl:text-lg font-Noto font-semibold text-text-secondary text-center max-w-[70%]">Enter your new password below. <br class="hidden xl:block"> Make sure it is at least eight characters.</h2>


             <form action="" id="password-reset"  class="w-full max-w-[90%] md:max-w-150 h-full xl:max-h-140 gap-y-10 flex flex-col items-center p-10 border rounded-xl xl:rounded-none border-border mb-10">

                 <div class="reset-password-input h-auto   w-full  flex flex-col gap-y-2 ">





                            <label for="reset-password" class="text-sm text-school-blue-dark font-bold">New password</label>

                            <div class="group relative">
                               

                                <input type="email" id="reset-password" class="w-full rounded-lg border border-gray-300 py-3 pr-10 pl-4 text-base font-Noto focus:border-school-blue  focus:ring-school-blue/20 outline-none placeholder:font-Noto placeholder:text-xs text-text-primary" placeholder="Enter new password">

                                <button type="button" class=" flex justify-center items-center absolute right-3 top-1/2 -translate-y-1/2 w-5 h-5 text-school-blue group-focus-within:text-school-blue-dark pointer-events-none">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 new-password-hide ">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                                    </svg>
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 hidden new-password-unhide">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                                    </svg>

                                </button>

                                


                                
                            </div>

                            <span id="error-email" class=" hidden text-school-red text-xs font-Noto">*Invalid email</span>

                            
                            
            </div>



              <div class="confirm-password-input h-auto   w-full  flex flex-col gap-y-2 ">





                            <label for="password-confirm" class="text-sm text-school-blue-dark font-bold">Confirm password</label>

                            <div class="group relative  ">
                               

                                <input type="email" id="password-confirm" class="w-full rounded-lg border border-gray-300 py-3 pr-10 pl-4 text-base font-Noto focus:border-school-blue  focus:ring-school-blue/20 outline-none placeholder:font-Noto placeholder:text-xs text-text-primary" placeholder="Confirm new password">

                                <button type="button" class=" absolute flex items-center justify-center right-3 top-1/2 -translate-y-1/2 w-5 h-5"> 

                                    <!-- Hide password icon -->

                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 confirm-password-hide   w-5 h-5 text-school-blue group-focus-within:text-school-blue-dark pointer-events-none">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                                        </svg>

                                    
                                
                                                    <!-- Unhide password icon -->
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 confirm-password-unhide hidden">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
</svg>

                            
                            
                            </button>


                                
                            </div>

                            <span id="error-email" class=" hidden text-school-red text-xs font-Noto">*Invalid email</span>

                            
                            
            </div>

               <button type="button" id="reset-password-btn" class="w-full h-12 bg-school-blue hover:bg-school-blue-dark cursor-pointer text-white font-Noto hover:text-school-green-white text-base  rounded-md">Reset Password</button>


             </form>

           

         
    </main>

    <footer  class="mt-10"></footer>

    <script src="./main.js"></script>
</body>
</html>
